name: CI
run-name: "${{ github.workflow }} (${{ github.ref_name }})"
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      astro: ${{ steps.filter.outputs.astro }}
      build: ${{ steps.filter.outputs.build }}
      dprint: ${{ steps.filter.outputs.dprint }}
      lint-config: ${{ steps.filter.outputs.lint-config }}
      renovate-config: ${{ steps.filter.outputs.renovate-config }}
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check diff targets by path filters
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - 'bun.lock'
              - '**/tsconfig*.json'
              - '**/*.astro'
              - '**/*.ts'
              - '**/*.tsx'
              - 'src/assets/*.json'
            astro:
              - 'bun.lock'
              - 'astro.config.*'
              - '**/*.astro'
              - '.markuplintrc*'
              - '.github/actions/**'
            build:
              - 'bun.lock'
              - 'package.json'
              - 'astro.config.*'
              - '**/tsconfig*.json'
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - '.github/actions/**'
            dprint:
              - 'bun.lock'
              - 'dprint.jsonc'
              - 'package.json'
              - '**/*.astro'
            lint-config:
              - '.oxlintrc.json'
              - 'eslint.config.*'
              - 'package.json'
              - '.github/actions/**'
            renovate-config:
              - '.github/renovate.json'

  renovate-config-lint:
    name: Renovate config lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup]
    if: ${{ needs.setup.outputs.renovate-config == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-environment/action.yml
            .github/renovate.json
            package.json
            bun.lock
          sparse-checkout-cone-mode: false

      - name: Initialize
        uses: ./.github/actions/setup-environment

      - name: Validate Renovate config
        run: bunx -p renovate renovate-config-validator --strict

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize
        uses: ./.github/actions/setup-environment

      - parallel:
          - name: Run format check (dprint)
            if: ${{ needs.setup.outputs.dprint == 'true' }}
            run: bun run lint:dprint

          - name: Run format check (oxfmt)
            run: bun run lint:oxfmt

          - name: Run lint
            if: ${{ needs.setup.outputs.typescript == 'true' || needs.setup.outputs.lint-config == 'true' }}
            run: bun run lint:oxeslint

          - name: Run Markuplint
            if: ${{ needs.setup.outputs.astro == 'true' }}
            run: bun run lint:markuplint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup]
    if: ${{ needs.setup.outputs.build == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize
        uses: ./.github/actions/setup-environment

      - name: Run build
        run: bun run build

  gatekeeper:
    name: Gatekeeper
    runs-on: ubuntu-slim
    timeout-minutes: 1
    needs:
      - setup
      - lint
      - build
      - renovate-config-lint
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - run: exit 1
